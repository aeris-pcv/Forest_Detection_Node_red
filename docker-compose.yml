services:
  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./fog/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
  nodered:
    build: ./fog
    restart: unless-stopped
    depends_on:
      - mqtt
      - influxdb
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      - TZ=Asia/Bangkok
      - THINGSPEAK_WRITE_KEY=${THINGSPEAK_WRITE_KEY:-}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-}
      - INFLUX_ORG=${INFLUX_ORG:-forestfire}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-telemetry}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_USER_ID=${LINE_USER_ID:-}
    volumes:
      - ./fog/flows.json:/data/flows.json:ro
      - nodered_data:/data
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD:-}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-forestfire}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-telemetry}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-}
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
volumes:
  mqtt_data:
  nodered_data:
  influx_data:
  influx_config:
